name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The process backend is meant to run anywhere; prove it rather than
        # assume it.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test
        env:
          # GitHub runners are slower and noisier than a laptop; the pool's
          # acquire timeout is generous enough, but keep logs off so a failure
          # is readable.
          IGNIS_LOG: 'off'

  postgres:
    # The Postgres store's interesting properties are Postgres' properties --
    # atomic version allocation, advisory locks, jsonb round-tripping -- so they
    # are tested against a real server rather than a fake. Service containers
    # are Linux-only, which is why this is its own job.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ignis
          POSTGRES_PASSWORD: ignis
          POSTGRES_DB: ignis_test
        ports:
          - 5432:5432
        # Without the health check the suite races the server's startup.
        options: >-
          --health-cmd "pg_isready -U ignis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Test against a real Postgres
        run: node --test "dist/test/postgres.test.js"
        env:
          IGNIS_LOG: 'off'
          IGNIS_TEST_DATABASE_URL: postgres://ignis:ignis@127.0.0.1:5432/ignis_test

      - name: Fail if the suite silently skipped
        # A skipped suite still exits 0, so a broken connection string would
        # look exactly like a passing run. Assert it actually executed.
        run: |
          node --test "dist/test/postgres.test.js" 2>&1 | tee /tmp/pg.log
          if grep -q "set IGNIS_TEST_DATABASE_URL to run" /tmp/pg.log; then
            echo "::error::postgres suite skipped -- it never reached the database"
            exit 1
          fi
        env:
          IGNIS_LOG: 'off'
          IGNIS_TEST_DATABASE_URL: postgres://ignis:ignis@127.0.0.1:5432/ignis_test

  bench:
    # Benchmark numbers from a shared CI runner are not comparable across runs,
    # so this gate only checks that the harness still runs and the warm path is
    # meaningfully faster than the cold one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Benchmark
        run: node dist/bench/bench.js --iterations 100 --concurrency 8 --json bench-results/ci.json

      - name: Assert warm pool still pays for itself
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("./bench-results/ci.json", "utf8"));
            const cold = r.scenarios.find((s) => s.name === "cold").coldStart.p50;
            const warm = r.scenarios.find((s) => s.name === "warm").latency.p50;
            console.log(`cold p50 ${cold.toFixed(1)}ms, warm p50 ${warm.toFixed(2)}ms`);
            if (!(cold / warm > 10)) {
              console.error("warm path is not meaningfully faster than cold -- pool regression?");
              process.exit(1);
            }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/ci.json
